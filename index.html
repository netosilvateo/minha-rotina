<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1F4B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Minha Rotina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FB;--surface:#FFFFFF;--ink:#151A33;--muted:#5B6280;--line:#E7E9F3;--soft:#EEF0F8;
  --hero:#1B1F4B;--hero2:rgba(255,255,255,.13);--heroMuted:#C5CAE8;--onAccent:#FFFFFF;
  --green:#0F8A5F;--greenSoft:#E1F4EC;--greenInk:#0B6B4A;
  --orange:#C9661A;--orangeSoft:#FDEBD8;--orangeInk:#9A4A08;
  --blue:#2F6FDB;--blueSoft:#E4EDFC;--blueInk:#1F55B3;
  --purple:#6B3FB0;--purpleSoft:#F1E9FB;--purpleLine:#D9CCEF;
  --red:#B42F28;--redSoft:#FBE6E4;--pink:#B8336A;--pinkSoft:#FBE4EE;--teal:#0E7C86;--tealSoft:#DDF2F3;
  --display:Sora,"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1022;--surface:#161B33;--ink:#EBEEFA;--muted:#A5ADC9;--line:#252C4A;--soft:#1F2644;
  --hero:#151B3E;--hero2:rgba(255,255,255,.11);--heroMuted:#B6BCDD;--onAccent:#0C1022;
  --green:#3CC98A;--greenSoft:#16382B;--greenInk:#86E3B8;
  --orange:#F0A15C;--orangeSoft:#3B2914;--orangeInk:#F6BE89;
  --blue:#78A5F2;--blueSoft:#1A2B4C;--blueInk:#A8C5F7;
  --purple:#B18CF0;--purpleSoft:#2A2246;--purpleLine:#4B3C78;
  --red:#F08A82;--redSoft:#3E1E1C;--pink:#F08FB8;--pinkSoft:#3D1D2C;--teal:#5CC8D0;--tealSoft:#14363A;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1022;--surface:#161B33;--ink:#EBEEFA;--muted:#A5ADC9;--line:#252C4A;--soft:#1F2644;
  --hero:#151B3E;--hero2:rgba(255,255,255,.11);--heroMuted:#B6BCDD;--onAccent:#0C1022;
  --green:#3CC98A;--greenSoft:#16382B;--greenInk:#86E3B8;
  --orange:#F0A15C;--orangeSoft:#3B2914;--orangeInk:#F6BE89;
  --blue:#78A5F2;--blueSoft:#1A2B4C;--blueInk:#A8C5F7;
  --purple:#B18CF0;--purpleSoft:#2A2246;--purpleLine:#4B3C78;
  --red:#F08A82;--redSoft:#3E1E1C;--pink:#F08FB8;--pinkSoft:#3D1D2C;--teal:#5CC8D0;--tealSoft:#14363A;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-bottom:110px;min-height:100%}
.hero{background:var(--hero);color:#FFFFFF;padding:22px 20px 28px;border-radius:0 0 32px 32px;display:flex;flex-direction:column;gap:20px}
.hero .sub{color:var(--heroMuted);font-size:14px;font-weight:600}
.hero h1{margin:0;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:4px}
.chip-pts{display:flex;align-items:center;gap:6px;background:var(--hero2);color:#FFD8A8;padding:10px 14px;border-radius:999px;font-weight:800;font-size:15px;border:none;white-space:nowrap}
.daynav{display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:none;background:var(--hero2);color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.light{background:var(--soft);color:var(--ink)}
.ringbox{position:relative;width:132px;height:132px;flex-shrink:0}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .n{font-family:var(--display);font-size:36px;font-weight:700;line-height:1}
.ring-fg{transition:stroke-dasharray .5s ease}
.streak{display:flex;align-items:center;gap:8px;background:var(--hero2);padding:8px 12px;border-radius:14px}
.main{padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.card.tight{padding:6px 14px;gap:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0}
.sec-h h2,.sec-h h3{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
.meta{font-size:13px;color:var(--muted);font-weight:700}
.small{font-size:13px;color:var(--muted);font-weight:600}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big{font-family:var(--display);font-size:26px;font-weight:700;margin:0;line-height:1.15}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
.btn{min-height:48px;border:none;border-radius:14px;font-weight:800;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.green{background:var(--green);color:var(--onAccent)}
.btn.purple{background:var(--purple);color:var(--onAccent)}
.btn.blue{background:var(--blueSoft);color:var(--blueInk)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn.sm{min-height:40px;font-size:13px;padding:0 12px;border-radius:12px}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft)}
.hrow:last-child{border-bottom:none}
.check{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:2.5px solid #B9C2D3;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--onAccent);transition:transform .15s ease}
.check.on{background:var(--green);border-color:var(--green)}
.check:active{transform:scale(.9)}
.hname{font-size:16px;font-weight:800}
.hrow.done .hname{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.wnum{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.orange{background:var(--orangeSoft);color:var(--orangeInk)}
.pill.green{background:var(--greenSoft);color:var(--greenInk)}
.pill.purple{background:var(--purpleSoft);color:var(--purple)}
.pill.gray{background:var(--soft);color:var(--muted)}
.dashed{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 18px;border:1.5px dashed #B9C2D3;border-radius:18px;background:transparent;font-weight:800;font-size:15px;width:100%}
.banner{border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.timer{display:flex;flex-direction:column;gap:12px;background:var(--soft);border-radius:16px;padding:14px;margin-bottom:12px}
.timer .t{font-family:var(--display);font-size:44px;font-weight:700;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;min-height:52px;color:var(--muted);font-size:11.5px;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--green);font-weight:800}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--hero2);border-radius:14px;padding:4px}
.seg button{border:none;background:transparent;color:var(--heroMuted);min-height:40px;border-radius:11px;font-weight:800}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#13203B}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--green);min-height:4px}
.bars .b span{font-size:11px;color:var(--muted);font-weight:700}
.bars.month{gap:2px}
.bars.month .b i{border-radius:4px 4px 2px 2px}
.statrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--soft)}
.statrow:last-child{border-bottom:none}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--soft)}
.badge .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--muted)}
.badge.on{background:var(--orangeSoft)}
.badge.on .ic{background:var(--orange);color:var(--onAccent)}
.badge b{font-size:12px;line-height:1.25}
.badge small{font-size:11px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{min-height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.input{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;width:100%}
.input.money{font-family:var(--display);font-size:30px;font-weight:700;min-height:64px}
textarea.input{padding:12px 14px;min-height:120px;font-size:13px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft)}
.list-item:last-child{border-bottom:none}
.datehead{font-size:13px;font-weight:800;color:var(--muted);padding:10px 4px 0}
.empty{padding:18px;text-align:center;color:var(--muted);font-weight:600}
.backdrop{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto;animation:up .22s ease}
.sheet h2{margin:0;font-family:var(--display);font-size:22px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details summary::-webkit-details-marker{display:none}
.ptable{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.ptable span:nth-child(even){font-weight:800;text-align:right}
.setgrid{display:grid;grid-template-columns:1fr 92px;gap:8px 12px;align-items:center}
.setgrid input{min-height:44px;text-align:center;padding:0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flabel{font-size:13px;font-weight:800;color:var(--muted)}
.ptext{margin:0;color:var(--muted);font-weight:600}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.lg{width:12px;height:12px;border-radius:3px;display:inline-block}
.chipbtn svg{margin-right:4px;vertical-align:-3px}
button.card{font:inherit;color:inherit;width:100%}

/* ===== visual v3 ===== */
:root{--heroA:#1B1F4B;--heroB:#3B3A9E;--shadow:0 1px 2px rgba(21,26,51,.05),0 12px 32px -16px rgba(21,26,51,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--heroA:#151B3E;--heroB:#2A2C73;--shadow:0 1px 0 rgba(255,255,255,.03),0 16px 32px -18px rgba(0,0,0,.65)}}
:root[data-theme="dark"]{--heroA:#151B3E;--heroB:#2A2C73;--shadow:0 1px 0 rgba(255,255,255,.03),0 16px 32px -18px rgba(0,0,0,.65)}
html{scroll-behavior:smooth}
body{background-image:radial-gradient(900px 420px at 85% -140px,rgba(99,102,241,.10),transparent 70%);background-repeat:no-repeat}
.hero{background:linear-gradient(135deg,var(--heroA),var(--heroB));position:relative;overflow:hidden;isolation:isolate;box-shadow:0 22px 40px -28px rgba(27,31,75,.8)}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.hero::before{width:300px;height:300px;right:-90px;top:-140px;background:radial-gradient(circle,rgba(129,140,248,.5),transparent 68%)}
.hero::after{width:240px;height:240px;left:-100px;bottom:-130px;background:radial-gradient(circle,rgba(61,214,140,.22),transparent 68%)}
.hero h1{letter-spacing:-.02em}
.bigstat{font-family:var(--display);font-size:44px;font-weight:700;line-height:1.05}
.card,.wcard{box-shadow:var(--shadow)}
.card{border-radius:24px}
.tile{border-radius:14px}
.btn{border-radius:16px;transition:transform .12s ease,filter .15s ease}
.btn:active{transform:scale(.98)}
.check.on{box-shadow:0 8px 16px -8px var(--green)}
.hrow{transition:background .15s ease}
.chipbtn{transition:background .15s,border-color .15s,color .15s}
.fullrow{width:100%}
.mgrid,.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fullrow .grid2{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mcard{gap:12px}
.poster{width:48px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.starbtn{width:52px;height:52px;border:none;background:var(--soft);border-radius:14px;display:flex;align-items:center;justify-content:center}
.starbtn:active{transform:scale(.92)}
.brand{display:none}
.mlist{order:1}.mform{order:2}
nav.tabs button{border-radius:14px;transition:background .15s,color .15s}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--soft)}
nav.tabs button[aria-current="page"] svg{color:var(--green)}
@supports (background:color-mix(in srgb,red,blue)){
  nav.tabs{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px)}
}
@media (hover:hover){
  .chipbtn:hover{border-color:var(--ink)}
  .btn:hover{filter:brightness(1.06)}
  .hrow:hover{background:var(--soft);border-radius:14px}
  nav.tabs button:hover{background:var(--soft)}
}
.wrap.solo>.hero,.wrap.solo>.main{max-width:640px;margin-left:auto;margin-right:auto}

/* tablet */
@media (min-width:600px) and (max-width:899px){
  .wrap{max-width:640px}
  nav.tabs .in{max-width:640px}
}

/* computador */
@media (min-width:900px){
  body{font-size:16px}
  .wrap{max-width:none;padding-bottom:56px}
  .wrap.hasnav{padding-left:264px}
  .wrap.hasnav>.hero,.wrap.hasnav>.main{width:calc(100% - 64px);max-width:1120px;margin-left:auto;margin-right:auto}
  .wrap.solo{padding-bottom:56px}
  .wrap.solo>.hero{margin-top:40px;border-radius:32px;padding:32px 36px}
  .wrap.solo>.main{display:flex;padding-top:24px}
  .wrap.hasnav>.hero{margin-top:28px;border-radius:32px;padding:32px 36px;gap:24px}
  .hero h1{font-size:38px}
  .ringbox{width:156px;height:156px}
  .ringbox svg{width:156px;height:156px}
  .ringbox .n{font-size:42px}
  .wrap.hasnav>.main{padding:28px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  .main>.banner,.main>.dashed,.main>.btn,.main>p,.main>details,.main>.empty,.main>.fullrow{grid-column:1/-1}
  .main>button.banner{grid-column:1/-1}
  .bars{height:200px}
  .mlist,.mform{order:0}
  .badges{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .mgrid,.cgrid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .bigstat{font-size:52px}

  nav.tabs{top:0;right:auto;width:248px;border-top:none;border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs .brand{display:flex;align-items:center;gap:12px;padding:2px 10px 26px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
  nav.tabs .brand i{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--heroA),var(--heroB));display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
  nav.tabs .in{display:flex!important;flex-direction:column;gap:4px;max-width:none;margin:0}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:14px;font-size:15px;padding:0 16px;min-height:50px}

  .backdrop{align-items:center;padding:24px}
  .sheet{max-width:560px;border-radius:28px;padding-bottom:22px}
  #toast{bottom:32px;left:calc(50% + 132px)}
}
@media (min-width:900px) and (hover:hover){
  .card:hover{transform:translateY(-1px);transition:transform .2s ease}
}

/* ===== v4: capas, ícones, compras ===== */
.poster{position:relative;overflow:hidden;width:56px;height:84px}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--soft)}
.cvthumb{width:44px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--soft)}
.covgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.covitem{display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;text-align:left;align-items:stretch}
.covitem img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--soft)}
.covitem b{font-size:12px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.covitem small{font-size:11px;color:var(--muted);font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cvbox{position:relative;aspect-ratio:2/3;border-radius:8px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden}
.covitem .cvbox img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover}
@media (hover:hover){.covitem:hover{border-color:var(--ink)}}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ===== v6: repaginada. O céu do dia pinta o app ===== */
:root{
  --bg:#ECF1F0;--surface:#FFFFFF;--ink:#12201E;--muted:#556866;--line:#D9E3E1;--soft:#E3EBE9;
  --display:"Bricolage Grotesque","Figtree","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --heroA:#121A3F;--heroB:#3B34A8;--glow:rgba(160,170,255,.28);--sunx:80%;--suny:18%;--shade:transparent;
  --shadow:0 1px 0 rgba(18,32,30,.04),0 14px 30px -20px rgba(18,32,30,.38);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1312;--surface:#121E1D;--ink:#E7F0EE;--muted:#9BB0AC;--line:#213330;--soft:#192826;--shade:rgba(0,0,0,.30);--shadow:0 16px 30px -20px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0A1312;--surface:#121E1D;--ink:#E7F0EE;--muted:#9BB0AC;--line:#213330;--soft:#192826;--shade:rgba(0,0,0,.30);--shadow:0 16px 30px -20px rgba(0,0,0,.7)}
:root[data-sky="night"]{--heroA:#121A3F;--heroB:#3B34A8;--glow:rgba(160,170,255,.28)}
:root[data-sky="morning"]{--heroA:#12486B;--heroB:#A44A32;--glow:rgba(255,206,140,.40)}
:root[data-sky="afternoon"]{--heroA:#0E3F75;--heroB:#1B7D8F;--glow:rgba(255,238,160,.34)}
:root[data-sky="evening"]{--heroA:#35195A;--heroB:#B23A4A;--glow:rgba(255,172,120,.40)}
body{background-image:none}
.hero{background:linear-gradient(var(--shade),var(--shade)),radial-gradient(46% 72% at var(--sunx) var(--suny),var(--glow),transparent 72%),linear-gradient(165deg,var(--heroA),var(--heroB));border-radius:0 0 40px 40px;padding:20px 22px 30px;text-shadow:0 1px 14px rgba(0,0,0,.2);box-shadow:none}
.hero::before,.hero::after{display:none}
.hero h1,.sec-h h2,.sheet h2,.big{font-weight:700;letter-spacing:-.015em}
.sec-h h2{font-size:22px}
.hname{font-weight:700}
.card{border:none;box-shadow:var(--shadow);border-radius:24px}
.card.tight{box-shadow:none;border:1px solid var(--line);border-radius:22px}
.card.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.tile{border-radius:14px}
.hrow{padding:14px 0}
.chipbtn{border-radius:999px}
.ring-fg{filter:drop-shadow(0 0 6px rgba(61,214,140,.55))}
.check{position:relative}
.check.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
.check.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--green);animation:ping .55s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.fab{background:var(--green);box-shadow:0 16px 30px -12px rgba(16,138,96,.7)}
@supports (background:color-mix(in srgb,red,blue)){.fab{background:linear-gradient(180deg,var(--green),color-mix(in srgb,var(--green) 80%,#000))}}
.seg.flow{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.seg.flow button{font-size:13px;padding:0 4px}
/* períodos do dia */
.pgroup{display:flex;flex-direction:column;gap:12px}
.phead{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;padding:4px;min-height:48px;text-align:left;border-radius:14px}
.phead .pi{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);flex-shrink:0}
.pgroup.now .phead .pi{background:var(--orangeSoft);color:var(--orange)}
.phead .pn{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.phead .pc{flex:1;font-size:13px;color:var(--muted);font-weight:700}
.phead>svg:last-child{color:var(--muted);transition:transform .15s ease;flex-shrink:0}
.pgroup.open .phead>svg:last-child{transform:rotate(90deg)}
.pbody{display:flex;flex-direction:column;gap:12px}
/* datas importantes e pausas */
.countstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.countstrip::-webkit-scrollbar{display:none}
.cchip{flex:0 0 auto;display:flex;align-items:center;gap:10px;border:none;background:var(--cs);color:var(--ink);border-radius:18px;padding:9px 16px 9px 9px;text-align:left}
.cchip .ci{width:36px;height:36px;border-radius:12px;background:var(--surface);color:var(--cc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cchip .ct{display:flex;flex-direction:column;line-height:1.2}
.cchip .ct b{font-family:var(--display);font-size:17px}
.cchip .ct span{font-size:12px;color:var(--muted);font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pausebn{background:var(--blueSoft);color:var(--blueInk)}
.pzrow{display:flex;flex-wrap:wrap;gap:8px}
.pzchip{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.pzchip b{color:var(--green);margin-left:4px}
/* evitar */
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.avnum{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.avnum b{font-family:var(--display);font-size:42px;font-weight:700;color:var(--ac)}
.avnum span{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.rep{display:inline-flex;color:var(--muted)}
.datehead.late{color:var(--orangeInk)}
.fatura{background:var(--purpleSoft);box-shadow:none}
@media (max-width:899px){
  nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:none;border-radius:28px;padding:6px;box-shadow:0 18px 40px -14px rgba(10,20,19,.5),0 0 0 1px var(--line)}
  nav.tabs .in{max-width:none}
  nav.tabs button{min-height:54px;border-radius:22px;gap:2px}

  .wrap{padding-bottom:124px}
  .fab{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
  .sheet{border-radius:32px 32px 0 0}
  .sheet::before{content:"";align-self:center;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-8px 0 2px;flex-shrink:0}
}
@media (min-width:900px){
  .main>.countstrip,.main>.pzrow,.main>.pausebn,.main>.pgroup,.main>.fatura{grid-column:1/-1}
  .main>.pgroup .pbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  .phead .pn{font-size:24px}
}
/* terço */
.rosbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;background:var(--ink);color:var(--bg);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow)}
.rosbtn .tile{background:rgba(255,255,255,.14);color:var(--bg)}
.rosbtn .col{flex:1;gap:1px;min-width:0}.rosbtn b{font-family:var(--display);font-size:19px}.rosbtn span.s{font-size:13px;opacity:.75;font-weight:600}
.rosary{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.rtop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;max-width:720px;width:100%;margin:0 auto}
.rtop .rt{font-weight:800;color:var(--muted)}
.rprog{height:4px;background:var(--soft);max-width:720px;width:calc(100% - 28px);margin:0 auto;border-radius:4px;overflow:hidden}.rprog i{display:block;height:100%;background:var(--green);transition:width .2s}
.rbody{flex:1;overflow-y:auto;padding:14px 18px 28px;max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rbody.mid{justify-content:center}
.rh{font-family:var(--display);font-size:32px;line-height:1.1;margin:0;letter-spacing:-.02em}
.rsub{margin:0;color:var(--muted);font-weight:600}
.rstep{display:flex;flex-direction:column;gap:12px}
.rph{font-size:13px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.rname{font-family:var(--display);font-size:24px;margin:0;line-height:1.2}
.rref{font-weight:700;color:var(--muted)}
.rmed{font-size:20px;line-height:1.55;margin:4px 0 0}
.rtext{font-size:22px;line-height:1.6;margin:0}
.rtext.blur{filter:blur(9px);user-select:none}
.beads{display:flex;gap:7px;flex-wrap:wrap}.beads i{width:20px;height:20px;border-radius:50%;background:var(--soft);border:1.5px solid var(--line)}.beads i.on{background:var(--green);border-color:var(--green)}
.rcnt{font-weight:800;color:var(--muted);font-size:14px}
.rfoot{padding:10px 18px calc(16px + env(safe-area-inset-bottom,0px));max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.rfoot .btn{min-height:56px;font-size:17px}
.rnum{width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.rpray{padding:16px 18px}.rpray h3{margin:0 0 6px;font-family:var(--display);font-size:20px}.rpray p{margin:0;line-height:1.55}

function sched(h,k){if(pausedOn(h,k))return false;if(h.freq.kind==='daily')return true;if(h.freq.kind==='days')return h.freq.days.includes(wdOf(k));return false;}
function planIdx(h){let n=DT().planOff[h.id]||0;for(const k in DT().days){const v=(DT().days[k].h||{})[h.id];if(Array.isArray(v))n+=v.length;}return Math.max(0,n);}
function firstKey(){let f=DT().start||todayKey();for(const k in DT().days)if(k<f)f=k;return f;}
function dayInfo(k){const r=dayRec(k);const sch=active().filter(h=>sched(h,k));const sd=sch.filter(h=>isDone(h,r.h[h.id])).length;const wk=active().filter(h=>isWeekly(h)&&isDone(h,r.h[h.id])).length;
  const tot=sch.length+wk;return{sch,schDone:sd,wkDone:wk,total:tot,doneN:sd+wk,pct:tot?Math.round((sd+wk)/tot*100):null,full:sch.length>0&&sd===sch.length,j:r.j};}
function freqTxt(h){if(h.freq.kind==='daily')return'Todo dia';if(h.freq.kind==='days')return h.freq.days.slice().sort().map(i=>WD[i]).join(', ')||'Nenhum dia';return h.freq.times+'x por semana';}

function compute(){
  const B=C().bonus,T=todayKey(),start=firstKey(),dates=start<=T?range(start,T):[T];const all=C().habits;
  let earned=0,s=0,rec=0,fullDays=0;const hab={};active().forEach(h=>hab[h.id]={cur:0,rec:0});
  for(const k of dates){
    const r=dayRec(k),info=dayInfo(k),isT=k===T;
    all.forEach(h=>{if(isWeekly(h))return;const v=r.h[h.id];if(isDone(h,v)){earned+=+h.pts||0;if(h.type==='plan'&&v.length>1)earned+=(v.length-1)*(+h.extraPts||0);}});
    if(info.full){earned+=B.dia100;s++;fullDays++;if(s%7===0)earned+=B.seq7;if(s%30===0)earned+=B.seq30;}
    else if(!(r.j||isT||info.sch.length===0))s=0;
    rec=Math.max(rec,s);
    active().forEach(h=>{if(isWeekly(h)||!sched(h,k))return;const o=hab[h.id];if(isDone(h,r.h[h.id])){o.cur++;o.rec=Math.max(o.rec,o.cur);}else if(!(r.j||isT))o.cur=0;});
  }
  let perfectWeeks=0;const weeks=[...new Set(dates.map(weekStart))];const curW=weekStart(T);
  for(const ws of weeks){const wd=range(ws,addDays(ws,6));let allG=true;
    all.forEach(h=>{if(!isWeekly(h))return;const c=wd.filter(k=>isDone(h,val(k,h))).length,g=+h.freq.times||1,pz=wd.some(k=>k<=T&&pausedOn(h,k));
      earned+=c*(+h.pts||0)+Math.max(0,c-g)*(+h.extraPts||0);if(c>=g)earned+=B.meta;
      if(!h.archived){const o=hab[h.id];if(c>=g){o.cur++;o.rec=Math.max(o.rec,o.cur);}else if(ws!==curW&&!pz){o.cur=0;}if(c<g&&!pz)allG=false;}});
    const ok=wd.every(k=>{if(k>T)return false;const i=dayInfo(k);return i.full||i.j||i.sch.length===0;})&&wd.some(k=>dayInfo(k).full);
    if(ok&&allG){earned+=B.semana;perfectWeeks++;}}
  const plans=[];
  all.forEach(h=>{if(h.type!=='plan')return;const p=planOf(h);if(!p)return;const idx=planIdx(h);let groupsDone=[];
    if(Array.isArray(p.groups)&&p.groups.length===p.items.length){const last={},order=[];p.groups.forEach((g,i)=>(Array.isArray(g)?g:[g]).forEach(x=>{if(!(x in last))order.push(x);last[x]=i;}));groupsDone=order.filter(x=>last[x]<idx);earned+=groupsDone.length*B.grupo;plans.push({h,p,idx,groupsDone,order,last});}
    else plans.push({h,p,idx,groupsDone:[],order:[],last:{}});});
  const spent=DT().redeemed.reduce((a,r)=>a+(r.pts||0),0);
  return{earned,spent,saldo:earned-spent,streak:s,record:rec,hab,fullDays,perfectWeeks,plans,days:dates.length};
}

    {id:'seq7',n:'7 dias perfeitos seguidos',ok:c.record>=7,p:Math.min(c.record,7)+'/7',ic:'flame'},

    {id:'dias100',n:'100 dias perfeitos',ok:c.fullDays>=100,p:Math.min(c.fullDays,100)+'/100',ic:'trophy'},
    {id:'semana',n:'Semana perfeita',ok:c.perfectWeeks>=1,p:Math.min(c.perfectWeeks,1)+'/1',ic:'trophy'},
    {id:'semana4',n:'4 semanas perfeitas',ok:c.perfectWeeks>=4,p:Math.min(c.perfectWeeks,4)+'/4',ic:'trophy'}];
  active().forEach(h=>{const o=c.hab[h.id];if(!o)return;if(isWeekly(h))L.push({id:'w4-'+h.id,n:'4 semanas de meta: '+h.name,ok:o.rec>=4,p:Math.min(o.rec,4)+'/4',ic:'check'});
    else L.push({id:'d30-'+h.id,n:'30 dias seguidos: '+h.name,ok:o.rec>=30,p:Math.min(o.rec,30)+'/30',ic:'flame'});});
  c.plans.forEach(x=>{if(x.h.archived)return;L.push({id:'plan-'+x.h.id+'-'+x.p.id,n:'Concluir: '+x.p.name,ok:x.idx>=x.p.items.length,p:Math.min(x.idx,x.p.items.length)+'/'+x.p.items.length,ic:'book'});});
  if(C().modules.premios){L.push({id:'pts1k',n:'1.000 pontos',ok:c.earned>=1000,p:num(Math.min(c.earned,1000))+'/1.000',ic:'star'},{id:'pts10k',n:'10.000 pontos',ok:c.earned>=10000,p:num(Math.min(c.earned,10000))+'/10.000',ic:'star'},{id:'premio1',n:'Primeiro prêmio',ok:DT().redeemed.length>=1,p:Math.min(DT().redeemed.length,1)+'/1',ic:'gift'});}
  return L;
}

async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);return r.json();}

const normT=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const IMGERR="if(this.dataset.alt){var a=this.dataset.alt;this.removeAttribute('data-alt');this.src=a}else{this.remove()}";
async function searchBooks(q){
  const qq=q.trim(),pr=qq.split(/\s*(?:,| - )\s*/);
  const gq=pr.length===2&&pr[0]&&pr[1]?'intitle:'+pr[0]+' inauthor:'+pr[1]:qq,E=encodeURIComponent;
  const G='https://www.googleapis.com/books/v1/volumes?printType=books&q='+E(gq);
  const gmap=j=>(j.items||[]).map(it=>{const v=it.volumeInfo||{},im=v.imageLinks||{},au=(v.authors||[]).join(', '),ids=v.industryIdentifiers||[],
      isbn=(ids.find(x=>x.type==='ISBN_13')||ids[0]||{}).identifier||'',own=httpsImg(im.thumbnail||im.smallThumbnail),
      alt=isbn?'https://covers.openlibrary.org/b/isbn/'+isbn+'-M.jpg?default=false':'';
    return{title:(v.title||'')+(v.subtitle?': '+v.subtitle:''),author:au,pages:v.pageCount||'',img:own||alt,alt:own?alt:'',lang:v.language||'',year:(v.publishedDate||'').slice(0,4),pub:v.publisher||''};}).filter(x=>x.title);
  const OF='&fields=title,author_name,cover_i,cover_edition_key,number_of_pages_median,first_publish_year&limit=12';
  const omap=j=>(j.docs||[]).map(d=>{const au=(d.author_name||[]).join(', ');
    return{title:d.title,author:au,pages:d.number_of_pages_median||'',img:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':d.cover_edition_key?'https://covers.openlibrary.org/b/olid/'+d.cover_edition_key+'-M.jpg?default=false':'',alt:'',lang:'',year:d.first_publish_year||'',pub:''};}).filter(x=>x.title);
  const rs=await Promise.allSettled([
    jget(G+'&langRestrict=pt&maxResults=20').then(gmap),
    jget(G+'&maxResults=12').then(gmap),
    jget('https://openlibrary.org/search.json?language=por'+OF+'&q='+E(qq)).then(omap),
    jget('https://openlibrary.org/search.json?'+OF.slice(1)+'&q='+E(qq)).then(omap),
    jget('https://openlibrary.org/search.json?language=por'+OF+'&title='+E(pr[0])).then(omap),
    jget('https://www.googleapis.com/books/v1/volumes?printType=books&maxResults=15&langRestrict=pt&q='+E(pr.length===2?qq.replace(/\s*(?:,| - )\s*/,' '):'intitle:'+qq)).then(gmap)]);
  if(rs.every(r=>r.status==='rejected'))throw new Error('rede');
  const all=[].concat(...rs.map(r=>r.status==='fulfilled'?r.value:[])),map=new Map();
  all.forEach(x=>{const k=normT(x.title)+'|'+normT((x.author||'').split(',')[0]),o=map.get(k);
    if(!o){map.set(k,x);return;}
    if(!o.img&&x.img){o.img=x.img;o.alt=x.alt;}
    if(!o.pages&&x.pages)o.pages=x.pages;if(!o.lang&&x.lang)o.lang=x.lang;if(!o.year&&x.year)o.year=x.year;});
  const pt=x=>/^pt/i.test(x.lang)?0:1;
  return[...map.values()].map((x,i)=>({x,i})).sort((a,b)=>pt(a.x)-pt(b.x)||(!a.x.img-!b.x.img)||a.i-b.i).map(o=>o.x).slice(0,18)
    .map(x=>({...x,sub:[x.author,x.year,/^pt/i.test(x.lang)?'Português':'',x.pub,x.img?'':'sem capa'].filter(Boolean).join(' · ')}));}
async function searchMovies(q){const key=(C().tmdbKey||'').trim();
  if(key){const j=await jget('https://api.themoviedb.org/3/search/multi?include_adult=false&language=pt-BR&api_key='+encodeURIComponent(key)+'&query='+encodeURIComponent(q));
    return(j.results||[]).filter(r=>(r.media_type==='movie'||r.media_type==='tv')&&r.poster_path).slice(0,12).map(r=>({title:r.title||r.name,img:'https://image.tmdb.org/t/p/w342'+r.poster_path,sub:[(r.release_date||r.first_air_date||'').slice(0,4),r.media_type==='tv'?'série':''].filter(Boolean).join(' · ')}));}
  const j=await jget('https://itunes.apple.com/search?media=movie&entity=movie&country=BR&limit=12&term='+encodeURIComponent(q));
  return(j.results||[]).filter(r=>r.artworkUrl100).map(r=>({title:r.trackName,img:r.artworkUrl100.replace('100x100bb','300x450bb'),sub:[(r.releaseDate||'').slice(0,4),r.primaryGenreName].filter(Boolean).join(' · ')}));}

function listCompras(){
  const L=C().shopping,open=L.filter(x=>!x.done),done=L.filter(x=>x.done);
  const groups={};open.forEach(x=>{const k=x.store||'';(groups[k]=groups[k]||[]).push(x);});
  const keys=Object.keys(groups).sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b,'pt-BR'));
  const row=x=>'<div class="list-item"><button class="check'+(x.done?' on':'')+'" data-a="shToggle" data-id="'+x.id+'" aria-pressed="'+!!x.done+'" aria-label="'+esc(x.name)+'">'+(x.done?ic('check',22,3):'')+'</button>'+
    '<div class="col" style="flex:1;min-width:0;gap:0"><span style="font-weight:800;overflow-wrap:anywhere;'+(x.done?'text-decoration:line-through;color:var(--muted)':'')+'">'+esc(x.name)+'</span>'+(x.done&&x.store?'<span class="small">'+esc(x.store)+'</span>':'')+'</div>'+
    (x.qty?'<span class="pill gray">'+esc(x.qty)+'</span>':'')+'<button class="iconbtn light" style="width:40px;height:40px" data-a="shDel" data-id="'+x.id+'" aria-label="Remover '+esc(x.name)+'">'+ic('x',18)+'</button></div>';
  let h='';
  if(!open.length)h+='<div class="card empty">'+(L.length?'Tudo comprado! Limpe a lista quando quiser.':'Sua lista está vazia. Toque em “Adicionar item” para começar.')+'</div>';
  else h+='<div class="cgrid">'+keys.map(k=>'<div class="col" style="gap:8px"><div class="datehead" style="padding-top:0">'+(k?esc(k):'Sem local definido')+' · '+groups[k].length+'</div><div class="card tight">'+groups[k].map(row).join('')+'</div></div>').join('')+'</div>';
  if(done.length)h+='<div class="sec-h" style="padding-top:10px"><h2>Comprados</h2><button class="btn sm ghost" data-a="shClear">Limpar comprados</button></div><div class="card tight">'+done.map(row).join('')+'</div>';
  return{stat:open.length+(open.length===1?' item para comprar':' itens para comprar')+(done.length?' · '+done.length+' no carrinho':''),lbl:'Adicionar item',h};
}
function taskRow(t,T){const n=t.date?diffDays(T,t.date):null,late=!t.done&&n!=null&&n<0;
  return'<div class="list-item"><button class="check'+(t.done?' on':'')+'" data-a="tkToggle" data-id="'+t.id+'" aria-pressed="'+!!t.done+'" aria-label="'+esc(t.title)+'">'+(t.done?ic('check',22,3):'')+'</button>'+
    '<div class="col" style="flex:1;min-width:0;gap:0"><span style="font-weight:800;overflow-wrap:anywhere;'+(t.done?'text-decoration:line-through;color:var(--muted)':'')+'">'+esc(t.title)+'</span>'+(t.note?'<span class="small">'+esc(t.note)+'</span>':'')+'</div>'+
    (t.repeat?'<span class="rep" title="Repete" aria-label="Repete">'+ic('repeat',16)+'</span>':'')+(t.date&&!t.done?'<span class="pill '+(late?'orange':'gray')+'">'+dueTxt(t.date,T)+'</span>':'')+
    '<button class="iconbtn light" style="width:40px;height:40px" data-a="tkDel" data-id="'+t.id+'" aria-label="Remover '+esc(t.title)+'">'+ic('x',18)+'</button></div>';}
function listTarefas(){
  const T=todayKey(),sub=ui.tsub,open=C().tasks.filter(t=>!t.done),done=C().tasks.filter(t=>t.done);
  const late=open.filter(t=>t.date&&t.date<T);
  let h='<div class="toolbar">'+subSeg('tsub',sub,[['tarefas','A fazer',open.length],['datas','Datas',C().dates.length]])+'</div>';
  if(sub==='tarefas'){
    const byD=(a,b)=>a.date.localeCompare(b.date);
    const grp=(title,list,cls)=>list.length?'<div class="col" style="gap:8px"><div class="datehead'+(cls?' '+cls:'')+'" style="padding-top:0">'+title+' · '+list.length+'</div><div class="card tight">'+list.map(t=>taskRow(t,T)).join('')+'</div></div>':'';
    const g=grp('Atrasadas',late.slice().sort(byD),'late')+grp('Hoje',open.filter(t=>t.date===T))+grp('Próximas',open.filter(t=>t.date&&t.date>T).sort(byD))+grp('Sem data',open.filter(t=>!t.date));
    h+=open.length?'<div class="cgrid">'+g+'</div>':'<div class="card empty">'+(done.length?'Tudo feito por aqui.':'Nada a fazer. Toque em “Nova tarefa” para anotar algo, como “ligar para o dentista”.')+'</div>';
    if(done.length)h+='<div class="col" style="gap:8px"><button class="fold" data-a="tkDoneToggle" aria-expanded="'+ui.showTkDone+'"><span>Feitas ('+done.length+')</span>'+ic('right',18)+'</button>'+(ui.showTkDone?'<div class="card tight">'+done.slice().sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).slice(0,30).map(t=>taskRow(t,T)).join('')+'</div><button class="btn sm ghost" style="align-self:flex-start" data-a="tkClear">Limpar feitas</button>':'')+'</div>';
    return{stat:open.length+(open.length===1?' a fazer':' a fazer')+(late.length?' · '+late.length+(late.length===1?' atrasada':' atrasadas'):''),lbl:'Nova tarefa',h};
  }
  const L=C().dates.map(d=>{const at=nextOcc(d,T);return{d,at,n:diffDays(T,at)};}).sort((a,b)=>((a.n<0)-(b.n<0))||(a.n<0?b.n-a.n:a.n-b.n));
  if(!L.length)h+='<div class="card empty">Nenhuma data ainda. Cadastre aniversários e viagens para ver quantos dias faltam no topo do Hoje.</div>';
  else h+='<div class="card tight">'+L.map(({d,at,n})=>{const [col,soft]=COLORS[KIND_COL[d.kind]||'purple'];
    const age=d.yearly&&d.kind==='aniv'&&parse(d.date).getFullYear()<parse(at).getFullYear()?' · faz '+(parse(at).getFullYear()-parse(d.date).getFullYear())+' anos':'';
    return'<div class="list-item"><span class="tile" style="background:'+soft+';color:'+col+'">'+ic(KIND_IC[d.kind]||'flag',20)+'</span><div class="col" style="flex:1;min-width:0;gap:0"><span style="font-weight:800;overflow-wrap:anywhere">'+esc(d.title)+'</span><span class="small">'+fmtShort(at)+age+(d.yearly?' · todo ano':'')+'</span></div>'+
      '<span class="pill '+(n<0?'gray':n<=7?'orange':'green')+'">'+(n<0?'passou':n===0?'hoje':n===1?'amanhã':'em '+n+' dias')+'</span><button class="iconbtn light" style="width:40px;height:40px" data-a="dtDel" data-id="'+d.id+'" aria-label="Remover '+esc(d.title)+'">'+ic('x',18)+'</button></div>';}).join('')+'</div>';
  const nx=L.find(x=>x.n>=0);
  return{stat:C().dates.length+(C().dates.length===1?' data':' datas')+(nx?' · próxima: '+nx.d.title+' '+(nx.n===0?'hoje':nx.n===1?'amanhã':'em '+nx.n+' dias'):''),lbl:'Nova data',h};
}

/* ---------- instalação como app ---------- */
let deferredInstall=null;
const isStandalone=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
function installCard(){
  let b='';
  if(isStandalone())b='<span class="small">O app já está instalado e aberto como aplicativo neste aparelho.</span>';
  else if(deferredInstall)b='<span class="small">Instale para abrir direto da tela inicial, em tela cheia, como um aplicativo.</span><button class="btn green full" data-a="install">'+ic('down')+'Instalar app</button>';
  else if(/iphone|ipad|ipod/i.test(navigator.userAgent))b='<span class="small">No iPhone, abra esta página no Safari, toque no botão de compartilhar e escolha “Adicionar à Tela de Início”.</span>';
  else b='<span class="small">No Chrome do celular, toque no menu (três pontinhos) e escolha “Instalar app” ou “Adicionar à tela inicial”. Se a opção não aparecer, a página precisa estar aberta pelo endereço https do site, e não por um arquivo baixado.</span>';
  return'<section class="card"><span style="font-size:16px;font-weight:800">Instalar no celular</span>'+b+'</section>';}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(ui.tab==='ajustes'&&!cloudBusy()&&!cloud.gate)render();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;if(ui.tab==='ajustes')render();setTimeout(()=>toast('App instalado'),200);});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});

function habitRow(hb,arch){const [col,soft]=COLORS[hb.color]||COLORS.green;
  return'<div class="list-item"><span class="tile" style="background:'+soft+';color:'+col+'">'+ic(typeIcon(hb),20)+'</span><div class="col" style="flex:1;gap:0;min-width:0"><span style="font-weight:800;overflow-wrap:anywhere">'+esc(hb.name)+'</span><span class="small">'+esc(typeTxt(hb))+' · '+esc(freqTxt(hb))+(hb.period&&hb.period!=='any'?' · '+periodName(hb.period):'')+(pauseNow(hb)?' · em pausa':'')+'</span></div>'+
  (arch?'<button class="btn sm ghost" data-a="unarchive" data-id="'+hb.id+'">Reativar</button>':
  '<div class="row" style="gap:4px"><button class="iconbtn light" style="width:40px;height:40px" data-a="hUp" data-id="'+hb.id+'" aria-label="Subir '+esc(hb.name)+'">'+ic('upA',18)+'</button><button class="iconbtn light" style="width:40px;height:40px" data-a="habitEdit" data-id="'+hb.id+'" aria-label="Editar '+esc(hb.name)+'">'+ic('pencil',18)+'</button></div>')+'</div>';}
function viewAjustes(){
  const B=C().bonus,arch=C().habits.filter(h=>h.archived);
  let h='<header class="hero"><h1>Ajustes</h1><span class="sub">Seus dados ficam salvos na nuvem e também neste aparelho.</span></header><main class="main">';
  h+=installCard();
  h+='<section class="card"><span style="font-size:16px;font-weight:800">Sincronização</span><span class="small">Conta: '+esc(cloud.user&&cloud.user.email||'')+'</span><span id="syncInfo" style="font-weight:700">'+esc(syncText())+'</span>'+
    '<div class="row"><button class="btn soft" style="flex:1" data-a="syncNow">Sincronizar agora</button><button class="btn ghost" style="flex:1" data-a="logout">Sair deste aparelho</button></div></section>';
  h+='<section class="col" style="gap:10px"><div class="sec-h"><h2>Minha rotina</h2><span class="meta">'+active().length+' hábitos</span></div><div class="card tight">'+(active().length?active().map(x=>habitRow(x)).join(''):'<div class="empty">Nenhum hábito ainda.</div>')+'</div>'+
    '<div class="row"><button class="btn green" style="flex:1" data-a="habitNew">'+ic('plus')+'Novo hábito</button><button class="btn ghost" style="flex:1" data-a="suggestOpen">Ver sugestões</button></div>'+pauseCard();
  if(arch.length)h+='<details class="card"><summary>Arquivados ('+arch.length+')'+ic('right',18)+'</summary><div class="col" style="gap:0">'+arch.map(x=>habitRow(x,true)).join('')+'</div></details>';
  h+='</section>';
  h+=avoidSection();
  h+='<section class="col" style="gap:10px"><div class="sec-h"><h2>Planos de leitura</h2><span class="meta">'+C().plans.length+'</span></div><div class="card tight">'+(C().plans.length?C().plans.map(p=>'<div class="list-item"><span class="tile" style="background:var(--purpleSoft);color:var(--purple)">'+ic('book',20)+'</span><div class="col" style="flex:1;gap:0;min-width:0"><span style="font-weight:800;overflow-wrap:anywhere">'+esc(p.name)+'</span><span class="small">'+p.items.length+' leituras</span></div><button class="iconbtn light" style="width:40px;height:40px" data-a="planEdit" data-id="'+p.id+'" aria-label="Editar '+esc(p.name)+'">'+ic('pencil',18)+'</button></div>').join(''):'<div class="empty">Crie um plano colando uma lista, uma leitura por linha.</div>')+'</div><button class="btn ghost" data-a="planNew">'+ic('plus')+'Novo plano de leitura</button></section>';
  h+='<section class="card"><span style="font-size:16px;font-weight:800">Backup</span><span class="small">'+(DT().lastBackup?'Último backup em '+fmtShort(DT().lastBackup):'Nenhum backup feito ainda')+'</span>'+
    '<button class="btn green full" data-a="bk" data-v="full">'+ic('down')+'Baixar backup completo</button>'+
    '<div class="row"><button class="btn ghost" style="flex:1" data-a="bk" data-v="config">Só a rotina</button><button class="btn ghost" style="flex:1" data-a="bk" data-v="data">Só os dados</button></div>'+
    '<span class="small">A rotina leva hábitos, planos, pontos, categorias, recorrentes e lista de desejos. Os dados levam o histórico, os gastos e os prêmios resgatados.</span>'+
    '<label class="btn soft full" for="restoreFile" style="cursor:pointer">'+ic('up')+'Restaurar de um arquivo</label><input id="restoreFile" class="vh" type="file" accept=".json,application/json,text/plain" data-restore="1">'+
    '<button class="btn soft full" data-a="pasteOpen">Restaurar colando o texto</button></section>';
  h+='<section class="card"><span style="font-size:16px;font-weight:800">Geral</span><div class="setgrid">'+
    '<label for="s-name">Seu nome</label><input id="s-name" class="input" data-set="name" data-str="1" value="'+esc(C().name)+'" style="text-align:left">'+
    '<label for="s-just">Justificados por mês</label><input id="s-just" class="input" type="number" inputmode="numeric" min="0" max="31" data-set="justLimit" value="'+C().justLimit+'">'+
    (pts()?'<label for="s-rate">Pontos por real</label><input id="s-rate" class="input" type="number" inputmode="numeric" min="1" data-set="rate" value="'+C().rate+'">':'')+(C().modules.gastos?'<label for="s-close">Dia em que a fatura do cartão fecha (0 = não usar)</label><input id="s-close" class="input" type="number" inputmode="numeric" min="0" max="31" data-set="closeDay" value="'+(C().closeDay||0)+'">':'')+'</div>'+
    '<span class="flabel">Seções do app</span><div class="chips"><button class="chipbtn" data-a="mod" data-v="premios" aria-pressed="'+C().modules.premios+'">Pontos e prêmios</button><button class="chipbtn" data-a="mod" data-v="gastos" aria-pressed="'+C().modules.gastos+'">Gastos</button><button class="chipbtn" data-a="mod" data-v="filmes" aria-pressed="'+C().modules.filmes+'">Filmes</button><button class="chipbtn" data-a="mod" data-v="livros" aria-pressed="'+C().modules.livros+'">Livros</button><button class="chipbtn" data-a="mod" data-v="compras" aria-pressed="'+C().modules.compras+'">Lista de compras</button><button class="chipbtn" data-a="mod" data-v="tarefas" aria-pressed="'+C().modules.tarefas+'">A fazer e datas</button><button class="chipbtn" data-a="mod" data-v="terco" aria-pressed="'+(C().modules.terco!==false)+'">Terço</button></div></section>';
  if(pts())h+='<details class="card"><summary>Pontos de bônus'+ic('right',18)+'</summary><div class="setgrid">'+
    [['dia100','Dia 100%'],['meta','Meta semanal batida'],['semana','Semana perfeita'],['seq7','7 dias 100% seguidos'],['seq30','30 dias 100% seguidos'],['grupo','Etapa de plano concluída']].map(([k,n])=>'<label for="b-'+k+'">'+n+'</label><input id="b-'+k+'" class="input" type="number" inputmode="numeric" min="0" data-set="bonus.'+k+'" value="'+B[k]+'">').join('')+'</div><span class="small">Os pontos de cada hábito ficam na edição do hábito.</span></details>';
  if(C().modules.gastos)h+='<details class="card"><summary>Categorias de gastos'+ic('right',18)+'</summary><div class="col" style="gap:0">'+C().categories.map(ct=>'<div class="list-item"><span style="flex:1;font-weight:700">'+esc(ct)+'</span><button class="iconbtn light" style="width:40px;height:40px" data-a="catDel" data-v="'+esc(ct)+'" aria-label="Remover '+esc(ct)+'">'+ic('x',18)+'</button></div>').join('')+
    '</div><div class="row"><label for="newCat" class="vh">Nova categoria</label><input id="newCat" class="input" placeholder="Nova categoria" style="flex:1"><button class="btn ink" data-a="catAdd">Adicionar</button></div></details>';
  h+='<section class="card"><span style="font-size:16px;font-weight:800">Aparência</span><div class="chips">'+[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([v,n])=>'<button class="chipbtn" data-a="theme" data-v="'+v+'" aria-pressed="'+((C().theme||'auto')===v)+'">'+n+'</button>').join('')+'</div></section>';
  if(C().modules.filmes)h+='<details class="card"><summary>Capas de filmes (opcional)'+ic('right',18)+'</summary><span class="small">Por padrão a busca usa o catálogo da Apple, sem cadastro, que cobre filmes. Para achar séries e mais títulos, crie uma chave grátis em themoviedb.org (Configurações, API) e cole aqui.</span><label class="vh" for="tmdb">Chave da API do TMDB</label><input id="tmdb" class="input" data-tmdb="1" placeholder="Chave da API do TMDB" autocomplete="off" value="'+esc(C().tmdbKey||'')+'"></details>';
  h+='<button class="btn danger full" data-a="resetAll">Apagar tudo e começar de novo</button>';
  return h+'</main>';
}

/* ---------- configuração inicial ---------- */
function suggestGrid(){return SUGGEST.map(([g,list])=>'<div class="col" style="gap:8px"><span class="flabel">'+g+'</span><div class="chips">'+list.map(([k,hb])=>'<button class="chipbtn" data-a="pick" data-v="'+k+'" aria-pressed="'+ui.pick.has(k)+'">'+(ui.pick.has(k)?ic('check',16,3):'')+esc(hb.name)+'</button>').join('')+'</div></div>').join('');}
function viewSetup(){
  const st=ui.step;const dots='<div class="row" style="gap:6px" aria-label="Passo '+st+' de 4">'+[1,2,3,4].map(i=>'<i style="width:'+(i===st?26:8)+'px;height:8px;border-radius:99px;background:'+(i<=st?'#3DD68C':'var(--hero2)')+';display:block"></i>').join('')+'</div>';
  let h='<header class="hero">'+dots;
  if(st===1){h+='<h1 style="font-size:34px">Monte sua rotina</h1><span class="sub" style="font-size:15px">Escolha seus hábitos, defina metas e acompanhe tudo em um só lugar. Leva uns 3 minutos.</span></header><main class="main">'+
    '<section class="card"><div class="field"><label for="su-name">Como você quer ser chamado? (opcional)</label><input id="su-name" class="input" data-set="name" data-str="1" value="'+esc(C().name)+'" placeholder="Seu nome"></div><button class="btn green full" style="min-height:54px" data-a="step" data-v="2">Começar</button></section>'+
    '<section class="card"><span style="font-weight:800">Já tem uma rotina pronta?</span><span class="small">Se alguém te passou um arquivo de rotina, ou você tem um backup, importe aqui.</span><label class="btn ghost full" for="restoreFile" style="cursor:pointer">'+ic('up')+'Importar arquivo</label><input id="restoreFile" class="vh" type="file" accept=".json,application/json,text/plain" data-restore="1"><button class="btn soft full" data-a="pasteOpen">Colar texto do arquivo</button></section></main>';}
  if(st===2){h+='<h1>Escolha seus hábitos</h1><span class="sub" style="font-size:15px">Toque para selecionar. Depois você ajusta cada um ou cria os seus.</span></header><main class="main"><section class="card">'+suggestGrid()+'</section>'+
    '<div class="row"><button class="btn ghost" data-a="step" data-v="1">Voltar</button><button class="btn green" style="flex:1" data-a="pickDone">'+(ui.pick.size?'Continuar com '+ui.pick.size:'Continuar')+'</button></div></main>';}
  if(st===3){h+='<h1>Ajuste sua rotina</h1><span class="sub" style="font-size:15px">Toque no lápis para mudar frequência, meta, pontos ou cor.</span></header><main class="main"><div class="card tight">'+(active().length?active().map(x=>habitRow(x)).join(''):'<div class="empty">Nenhum hábito ainda. Crie um ou volte às sugestões.</div>')+'</div>'+
    '<button class="btn ghost" data-a="habitNew">'+ic('plus')+'Criar hábito personalizado</button><div class="row"><button class="btn ghost" data-a="step" data-v="2">Voltar</button><button class="btn green" style="flex:1" data-a="step" data-v="4" '+(active().length?'':'disabled')+'>Continuar</button></div></main>';}
  if(st===4){h+='<h1>Últimos detalhes</h1><span class="sub" style="font-size:15px">Escolha o que mais o app vai ter. Dá para mudar depois em Ajustes.</span></header><main class="main">'+
    '<button class="card" style="text-align:left;cursor:pointer" data-a="mod" data-v="premios" aria-pressed="'+C().modules.premios+'"><div class="between"><span style="font-size:17px;font-weight:800">Pontos e prêmios</span><span class="check'+(C().modules.premios?' on':'')+'" aria-hidden="true">'+(C().modules.premios?ic('check',22,3):'')+'</span></div><span class="small">Cada hábito vale pontos. Você cadastra o que quer ganhar e só compra quando atingir os pontos.</span></button>'+
    '<button class="card" style="text-align:left;cursor:pointer" data-a="mod" data-v="gastos" aria-pressed="'+C().modules.gastos+'"><div class="between"><span style="font-size:17px;font-weight:800">Controle de gastos</span><span class="check'+(C().modules.gastos?' on':'')+'" aria-hidden="true">'+(C().modules.gastos?ic('check',22,3):'')+'</span></div><span class="small">Anote cada gasto em poucos toques, veja o total do mês por categoria e cadastre contas fixas.</span></button>'+
    '<button class="card" style="text-align:left;cursor:pointer" data-a="mod" data-v="filmes" aria-pressed="'+C().modules.filmes+'"><div class="between"><span style="font-size:17px;font-weight:800">Filmes para assistir</span><span class="check'+(C().modules.filmes?' on':'')+'" aria-hidden="true">'+(C().modules.filmes?ic('check',22,3):'')+'</span></div><span class="small">Monte sua lista de filmes, sorteie o da noite e marque os que já viu com uma nota.</span></button>'+
    '<button class="card" style="text-align:left;cursor:pointer" data-a="mod" data-v="livros" aria-pressed="'+C().modules.livros+'"><div class="between"><span style="font-size:17px;font-weight:800">Livros</span><span class="check'+(C().modules.livros?' on':'')+'" aria-hidden="true">'+(C().modules.livros?ic('check',22,3):'')+'</span></div><span class="small">Fila de leitura, livro em andamento com página atual e os já lidos com nota.</span></button>'+
    '<button class="card" style="text-align:left;cursor:pointer" data-a="mod" data-v="compras" aria-pressed="'+C().modules.compras+'"><div class="between"><span style="font-size:17px;font-weight:800">Lista de compras</span><span class="check'+(C().modules.compras?' on':'')+'" aria-hidden="true">'+(C().modules.compras?ic('check',22,3):'')+'</span></div><span class="small">Itens com quantidade e local de compra, separados por loja.</span></button>'+
    '<button class="card" style="text-align:left;cursor:pointer" data-a="mod" data-v="tarefas" aria-pressed="'+C().modules.tarefas+'"><div class="between"><span style="font-size:17px;font-weight:800">A fazer e datas</span><span class="check'+(C().modules.tarefas?' on':'')+'" aria-hidden="true">'+(C().modules.tarefas?ic('check',22,3):'')+'</span></div><span class="small">Tarefas pontuais com data, como “ligar para o dentista”, e contagem regressiva para aniversários e viagens.</span></button>'+
    '<div class="row"><button class="btn ghost" data-a="step" data-v="3">Voltar</button><button class="btn green" style="flex:1;min-height:54px" data-a="finish">Começar a usar</button></div></main>';}
  return h;
}

/* ---------- folhas (modais) ---------- */
function habitSheet(){const e=ui.edit;const isNew=!habitById(e.id);
  let b='<h2>'+(isNew?'Novo hábito':'Editar hábito')+'</h2>'+
    '<div class="field"><label for="e-name">Nome</label><input id="e-name" class="input" data-e="name" value="'+esc(e.name)+'" placeholder="Ex.: Beber água"></div>'+
    '<div class="field"><span class="flabel">Tipo</span><div class="chips">'+TYPES.map(([t,n])=>'<button class="chipbtn" data-a="eType" data-v="'+t+'" aria-pressed="'+(e.type===t)+'">'+n+'</button>').join('')+'</div></div>';
  if(e.type==='qty')b+='<div class="setgrid"><label for="e-goal">Meta por dia</label><input id="e-goal" class="input" type="number" inputmode="decimal" min="0" data-e="goal" value="'+esc(e.goal)+'">'+
    '<label for="e-unit">Unidade</label><input id="e-unit" class="input" data-e="unit" value="'+esc(e.unit)+'" placeholder="ml, páginas, km">'+
    '<label for="e-s1">Botão 1 (+)</label><input id="e-s1" class="input" type="number" inputmode="decimal" min="0" data-e="s0" value="'+esc(e.steps[0])+'">'+
    '<label for="e-s2">Botão 2 (+)</label><input id="e-s2" class="input" type="number" inputmode="decimal" min="0" data-e="s1" value="'+esc(e.steps[1])+'"></div>';
  if(e.type==='time')b+='<div class="setgrid"><label for="e-min">Minutos do cronômetro</label><input id="e-min" class="input" type="number" inputmode="numeric" min="1" data-e="minutes" value="'+esc(e.minutes)+'"></div>';
  if(e.type==='plan')b+='<div class="field"><span class="flabel">Plano de leitura</span><div class="chips">'+C().plans.map(p=>'<button class="chipbtn" data-a="ePlan" data-v="'+p.id+'" aria-pressed="'+(e.planId===p.id)+'">'+esc(p.name)+'</button>').join('')+
    (C().plans.some(p=>p.tpl==='biblia')?'':'<button class="chipbtn" data-a="ePlanTpl">Bíblia em 2 capítulos/dia (pronto)</button>')+'<button class="chipbtn" data-a="ePlanNew">'+ic('plus',16)+'Criar plano</button></div></div>';
  if(e.type==='check')b+='<div class="field"><label for="e-opt">Opções ao marcar (opcional)</label><input id="e-opt" class="input" data-e="options" value="'+esc(e.options)+'" placeholder="Ex.: Matemática, Inglês"><span class="small">Separe por vírgula. Ao marcar, o app pergunta qual foi.</span></div>';
  const fk=e.freq.kind,canW=e.type==='check'||e.type==='time';
  b+='<div class="field"><span class="flabel">Frequência</span><div class="chips"><button class="chipbtn" data-a="eFreq" data-v="daily" aria-pressed="'+(fk==='daily')+'">Todo dia</button><button class="chipbtn" data-a="eFreq" data-v="days" aria-pressed="'+(fk==='days')+'">Dias fixos</button>'+(canW?'<button class="chipbtn" data-a="eFreq" data-v="weekly" aria-pressed="'+(fk==='weekly')+'">Vezes por semana</button>':'')+'</div></div>';
  if(fk==='days')b+='<div class="chips" role="group" aria-label="Dias da semana">'+WD.map((d,i)=>'<button class="chipbtn" style="min-width:52px" data-a="eDay" data-v="'+i+'" aria-pressed="'+e.freq.days.includes(i)+'">'+d+'</button>').join('')+'</div>';
  if(fk==='weekly')b+='<div class="setgrid"><label for="e-times">Meta por semana</label><input id="e-times" class="input" type="number" inputmode="numeric" min="1" max="7" data-e="times" value="'+esc(e.freq.times)+'"></div><span class="small">Dias livres. Cada vez acima da meta vale bônus.</span>';
  if(pts())b+='<div class="setgrid"><label for="e-pts">Pontos'+(fk==='weekly'?' por vez':'')+'</label><input id="e-pts" class="input" type="number" inputmode="numeric" min="0" data-e="pts" value="'+esc(e.pts)+'">'+
    (fk==='weekly'?'<label for="e-ex">Bônus por vez acima da meta</label><input id="e-ex" class="input" type="number" inputmode="numeric" min="0" data-e="extraPts" value="'+esc(e.extraPts)+'">':'')+
    (e.type==='plan'?'<label for="e-ex2">Pontos por leitura adicional no dia</label><input id="e-ex2" class="input" type="number" inputmode="numeric" min="0" data-e="extraPts" value="'+esc(e.extraPts)+'">':'')+'</div>';
  b+='<div class="field"><span class="flabel">Período do dia</span><div class="chips">'+PERIODS.map(([p,nm])=>'<button class="chipbtn" data-a="ePeriod" data-v="'+p+'" aria-pressed="'+((e.period||'any')===p)+'">'+nm+'</button>').join('')+'</div></div>';
  if(!isNew){const pe=pauseEntry(e.id,todayKey());b+='<div class="field"><span class="flabel">Pausa</span>'+(pe?'<span class="small">Em pausa'+(pe.to?' até '+fmtShort(pe.to):', sem data de volta')+'.</span><button class="btn soft" data-a="pauseEnd" data-id="'+e.id+'">Retomar agora</button>':'<button class="btn soft" data-a="pauseOpen" data-id="'+e.id+'">'+ic('pause',18)+'Pausar este hábito</button>')+'</div>';}
  b+='<div class="field"><span class="flabel">Ícone</span><div class="chips" role="group" aria-label="Ícone">'+'<button class="chipbtn" data-a="eIcon" data-v="" aria-pressed="'+(!e.icon)+'">Padrão</button>'+ICON_CHOICES.map(k=>'<button class="chipbtn iconopt" data-a="eIcon" data-v="'+k+'" aria-pressed="'+(e.icon===k)+'" aria-label="'+ICON_NAMES[k]+'">'+ic(k,22)+'</button>').join('')+'</div></div>';
  b+='<div class="field"><span class="flabel">Cor</span><div class="chips">'+Object.keys(COLORS).map(k=>'<button class="swatch" data-a="eColor" data-v="'+k+'" aria-pressed="'+(e.color===k)+'" aria-label="Cor '+k+'" style="background:'+COLORS[k][0]+'"></button>').join('')+'</div></div>';
  b+='<div class="row"><button class="btn ghost" style="flex:1" data-a="sheetClose">Cancelar</button><button class="btn green" style="flex:1" data-a="habitSave">Salvar</button></div>';
  if(!isNew)b+='<button class="btn danger" data-a="habitArchive">'+ic('archive',18)+'Arquivar hábito</button><span class="small">Arquivar tira o hábito do dia a dia, mas mantém o histórico e os pontos já ganhos.</span>';
  return b;}
function sheetHtml(){const s=ui.sheet;if(!s)return'';let b='';
  if(s.type==='habit')b=habitSheet();
  if(s.type==='option'){const hb=habitById(s.hid);b='<h2>'+esc(hb.name)+': qual foi?</h2><div class="chips">'+hb.options.split(',').map(x=>x.trim()).filter(Boolean).map(o=>'<button class="btn ink" style="flex:1 1 40%" data-a="optPick" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div><button class="btn ghost" data-a="sheetClose">Cancelar</button>';}
  if(s.type==='confirm')b='<h2>'+esc(s.title)+'</h2><p class="ptext">'+esc(s.text)+'</p><div class="row"><button class="btn ghost" style="flex:1" data-a="sheetClose">Cancelar</button><button class="btn '+(s.danger?'danger':'ink')+'" style="flex:1" data-a="confirmYes">'+esc(s.yes)+'</button></div>';
