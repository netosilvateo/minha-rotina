const ROSDAY=['gl','go','do','gl','lu','do','go'],DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const rosToday=()=>ROSDAY[parse(todayKey()).getDay()];
function rosSteps(set){const M=MYST[set][2],S=[];
  S.push({p:'cruz',ph:'Início'},{p:'creio',ph:'Início'},{p:'pai',ph:'Início',sub:'Na primeira conta grande'});
  ['Pela fé','Pela esperança','Pela caridade'].forEach((t,j)=>S.push({p:'ave',ph:'Início',sub:t,beads:[j+1,3]}));
  S.push({p:'gloria',ph:'Início'});
  M.forEach((m,mi)=>{const ph='Mistério '+(mi+1)+' de 5 · '+MYST[set][0];
    S.push({head:1,mi,ph,title:(mi+1)+'º Mistério',name:m[0],ref:m[1],med:m[2]});
    S.push({p:'pai',ph,mi});
    for(let j=1;j<=10;j++)S.push({p:'ave',ph,mi,beads:[j,10]});
    S.push({p:'gloria',ph,mi},{p:'jacul',ph,mi});});
  S.push({p:'salve',ph:'Final'},{p:'cruz',ph:'Final'});return S;}
function rosHtml(){const R=ui.ros;if(!R)return'';
  const top=(t,back)=>'<div class="rtop">'+(back?'<button class="iconbtn light" data-a="'+back+'" aria-label="Voltar">'+ic('left',22)+'</button>':'<span></span>')+'<span class="rt">'+t+'</span><button class="iconbtn light" data-a="rosClose" aria-label="Fechar">'+ic('x',22)+'</button></div>';
  if(R.view==='orac')return'<div class="rosary" role="dialog" aria-label="Orações">'+top('Orações','rosBack')+'<div class="rbody">'+Object.keys(PRAYERS).map(k=>'<div class="card tight rpray"><h3>'+PRAYERS[k][0]+'</h3><p>'+PRAYERS[k][1]+'</p></div>').join('')+'</div></div>';
  if(R.view==='start'){const M=MYST[R.set],hoje=R.set===rosToday();
    return'<div class="rosary" role="dialog" aria-label="Terço">'+top('Rezar o terço')+'<div class="rbody"><h1 class="rh">Mistérios '+M[0]+'</h1><p class="rsub">'+(hoje?'Os de hoje, '+DIAS[parse(todayKey()).getDay()]+'. ':'')+M[1]+'.</p>'+
      '<div class="chips">'+Object.keys(MYST).map(k=>'<button class="chipbtn" data-a="rosSet" data-v="'+k+'" aria-pressed="'+(R.set===k)+'">'+MYST[k][0]+(k===rosToday()?' · hoje':'')+'</button>').join('')+'</div>'+
      '<div class="card tight">'+M[2].map((m,i)=>'<div class="list-item" style="align-items:flex-start"><span class="rnum">'+(i+1)+'</span><div class="col" style="gap:2px;min-width:0"><b>'+m[0]+'</b><span class="small">'+m[1]+'</span></div></div>').join('')+'</div>'+
      '<button class="btn green full" data-a="rosStart">Começar</button><button class="btn soft full" data-a="rosOrac">Ver as orações</button></div></div>';}
  const S=rosSteps(R.set),st=S[R.i],last=R.i>=S.length-1,pr=st.p?PRAYERS[st.p]:null,pct=R.i/(S.length-1)*100;
  let b='<div class="rstep"><div class="rph">'+st.ph+'</div>';
  if(st.head)b+='<h1 class="rh">'+st.title+'</h1><h2 class="rname">'+st.name+'</h2><span class="rref">'+st.ref+'</span><p class="rmed">'+st.med+'</p>';
  else{b+='<h1 class="rh">'+pr[0]+'</h1>'+(st.sub?'<span class="rref">'+st.sub+'</span>':'');
    if(st.beads)b+='<div class="beads" aria-label="Ave-Maria '+st.beads[0]+' de '+st.beads[1]+'">'+Array.from({length:st.beads[1]},(_,n)=>'<i class="'+(n<st.beads[0]?'on':'')+'"></i>').join('')+'</div><div class="rcnt">'+st.beads[0]+' de '+st.beads[1]+'</div>';
    b+='<p class="rtext'+(R.hide&&!R.peek?' blur':'')+'">'+pr[1]+'</p>';}
  b+='</div>';
  return'<div class="rosary" role="dialog" aria-label="Terço">'+top('Terço','rosBack')+'<div class="rprog"><i style="width:'+pct+'%"></i></div><div class="rbody mid">'+b+'</div>'+
    '<div class="rfoot"><div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">'+(st.head?'':'<button class="chipbtn" data-a="rosHide" aria-pressed="'+!!R.hide+'">Esconder o texto</button>'+(R.hide?'<button class="chipbtn" data-a="rosPeek" aria-pressed="'+!!R.peek+'">Espiar</button>':''))+'</div>'+
    '<div class="row"><button class="btn ghost" style="flex:1" data-a="rosPrev"'+(R.i===0?' disabled':'')+'>Voltar</button><button class="btn green" style="flex:2" data-a="rosNext">'+(last?'Concluir':'Próxima')+'</button></div></div></div>';}
async function rosWake(on){try{if(on){if(navigator.wakeLock&&!ui.wl)ui.wl=await navigator.wakeLock.request('screen');}else if(ui.wl){await ui.wl.release();ui.wl=null;}}catch(e){ui.wl=null;}}
function render(){
  applySky();
  const app=document.getElementById('app');
  if(cloud.gate){app.className='wrap solo';app.innerHTML=viewGate();return;}
  if(['filmes','livros','compras'].includes(ui.tab)){ui.list=ui.tab;ui.tab='listas';}
  if(ui.tab==='premios'){ui.tab='resumo';ui.rsec='premios';}
  if(ui.tab==='gastos'&&!C().modules.gastos)ui.tab='hoje';
  if(ui.tab==='listas'){const on=listsOn();if(!on.length)ui.tab='hoje';else if(!on.some(x=>x[0]===ui.list))ui.list=on[0][0];}
  if(ui.tab==='setup'){app.className='wrap solo';app.innerHTML=viewSetup()+sheetHtml();return;}
  app.className='wrap hasnav';const c=compute();const t=tabs();
  const v=ui.tab==='hoje'?viewHoje(c):ui.tab==='listas'?viewListas():ui.tab==='gastos'?viewGastos()+fabHtml('Novo gasto'):ui.tab==='resumo'?(ui.rsec==='premios'&&pts()?viewPremios(c):viewResumo(c)):viewAjustes();
  app.innerHTML=v+'<nav class="tabs" aria-label="Seções"><div class="brand"><i>'+ic('cal',22)+'</i>Minha Rotina</div><div class="in'+(t.length>6?' scroll':'')+'" style="grid-template-columns:repeat('+t.length+',minmax(0,1fr))">'+t.map(([k,n,i])=>'<button data-a="tab" data-v="'+k+'" '+(ui.tab===k?'aria-current="page"':'')+'>'+ic(i,24)+n+'</button>').join('')+'</div></nav>'+sheetHtml();
  if(ui.pop){const el=app.querySelector('.check.on[data-id="'+ui.pop+'"]');if(el)el.classList.add('pop');ui.pop=null;}
  const nv=app.querySelector('nav.tabs .in.scroll');if(nv){const a=nv.querySelector('[aria-current]');if(a)nv.scrollLeft=a.offsetLeft-nv.clientWidth/2+a.offsetWidth/2;}
  if(ui.ros)app.insertAdjacentHTML('beforeend',rosHtml());
  checkAch(c);
}
function applyTheme(){const t=C().theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);}
let toastT=null;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2400);}
function checkAch(c){const a=achievements(c).filter(x=>x.ok&&!DT().seen.includes(x.id));if(a.length){DT().seen.push(...a.map(x=>x.id));save();setTimeout(()=>toast('Conquista: '+a[0].n),600);}}
function act(fn){const b=pts()?compute().earned:0;fn();save();const a=pts()?compute().earned:0;render();if(a>b)toast('+'+num(a-b)+' pts');}
function ask(title,text,yes,fn,danger,noPts){confirmFn=fn;confirmNoPts=!!noPts;ui.sheet={type:'confirm',title,text,yes,danger};render();}

/* ================= cronômetro ================= */
function timerRemain(){const t=ui.timer;return t.running?Math.max(0,t.endAt-Date.now())/1000:t.remain;}
function fmtTimer(hb){const t=ui.timer;const r=Math.ceil(hb&&t.hid!==hb.id?(+hb.minutes||1)*60:timerRemain());return pad(Math.floor(r/60))+':'+pad(r%60);}
function timerPct(){const t=ui.timer;return t.total?(1-timerRemain()/t.total)*100:0;}
setInterval(()=>{const t=ui.timer;if(!t.running)return;const txt=fmtTimer();
  const a=document.getElementById('ttxt'),b=document.getElementById('tbar');if(a)a.textContent=txt;if(b)b.style.width=timerPct()+'%';document.querySelectorAll('.tmini[data-h="'+t.hid+'"]').forEach(x=>x.textContent=txt);
  if(timerRemain()<=0){t.running=false;t.open=false;const hb=habitById(t.hid);t.hid=null;
    try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
    try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();o.frequency.value=880;o.connect(ac.destination);o.start();o.stop(ac.currentTime+.6);}catch(e){}
    if(hb){act(()=>{dayW(todayKey()).h[hb.id]=true;});toast(hb.name+': tempo concluído!');}}
},250);

/* ================= backup ================= */
let dlCap=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(x=>{dlCap=x;}).catch(()=>{});}catch(e){}
function payload(kind){const o={app:'minha-rotina',v:2,kind,exportedAt:new Date().toISOString()};if(kind!=='data')o.config=clone(C());if(kind!=='config')o.data=clone(DT());return o;}
async function backup(kind){
  const txt=JSON.stringify(payload(kind)),fn='rotina-'+({full:'completo',config:'rotina',data:'dados'}[kind])+'-'+todayKey()+'.json';
  const mark=()=>{if(kind!=='config'){DT().lastBackup=todayKey();save();}};
  if(dlCap){try{await dlCap.save({filename:fn,data:txt});mark();render();toast('Arquivo salvo');return;}catch(e){if(e&&e.code==='declined'){toast('Download cancelado');return;}}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();}catch(e){}
  mark();ui.sheet={type:'bkText',text:txt};render();
}
function tryRestore(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast('Arquivo inválido: não é um arquivo deste app');return;}
  if(!o||o.app!=='minha-rotina'||!['full','config','data'].includes(o.kind)){toast('Arquivo inválido: não é um arquivo deste app');return;}
  const cf=o.config?normConfig(o.config):null,dt=o.data?normData(o.data):null;
  const pl=(n,a,b)=>n+' '+(n===1?a:b);const parts=[];if(cf)parts.push(pl(cf.habits.filter(h=>!h.archived).length,'hábito','hábitos')+', '+pl(cf.plans.length,'plano','planos')+' e '+pl(cf.wishes.length,'desejo','desejos'));if(dt)parts.push(pl(Object.keys(dt.days).length,'dia registrado','dias registrados')+' e '+pl(dt.expenses.length,'gasto','gastos'));
  const title={full:'Restaurar backup completo?',config:'Usar esta rotina?',data:'Restaurar estes dados?'}[o.kind];
  const text='O arquivo tem '+parts.join(' e ')+'. '+({full:'Tudo o que está salvo hoje será substituído, inclusive na nuvem.',config:'Sua rotina atual será substituída. Seu histórico continua, e hábitos que saírem ficam arquivados.',data:'Seu histórico atual será substituído. A rotina continua a mesma.'}[o.kind]);
  ask(title,text,o.kind==='config'?'Usar rotina':'Restaurar',()=>{if(cf){cf.setupDone=true;S.config=cf;}if(dt)S.data=dt;ensurePlaceholders();save();applyTheme();ui.sel=todayKey();ui.tab='hoje';setTimeout(()=>toast(o.kind==='config'?'Rotina importada':'Backup restaurado'),200);},false,true);
}

/* ================= hábitos: criar a partir de sugestões ================= */
function bibleTpl(){let p=C().plans.find(x=>x.tpl==='biblia');if(!p){p={id:uid(),name:'Bíblia em 2 capítulos por dia',items:BIBLE.items.slice(),groups:BIBLE.groups.slice(),tpl:'biblia'};C().plans.push(p);}return p;}
function addSuggestions(){const all={};SUGGEST.forEach(([,l])=>l.forEach(([k,hb])=>all[k]=hb));
  ui.pick.forEach(k=>{const base=clone(all[k]);delete base.planTpl;const hb=normHabit({...base,id:uid()});if(all[k].planTpl==='biblia')hb.planId=bibleTpl().id;C().habits.push(hb);});ui.pick=new Set();}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,id=t.dataset.id,T=todayKey();
  if(a==='backdrop'){if(e.target===t){ui.sheet=null;render();}return;}
  switch(a){
    case'login':cloudLogin();break;
    case'reload':location.reload();break;
    case'logoutNow':cloudLogout();break;
    case'logout':ask('Sair deste aparelho?',(cloud.status==='ok'?'':'Ainda há alterações que não subiram para a nuvem e elas serão perdidas. ')+'Seus dados continuam na nuvem, mas a cópia deste aparelho será apagada. Use isto em aparelhos de outras pessoas.','Sair',()=>{cloudLogout();},true,true);break;
    case'syncNow':if(!cloud.ready){toast('Ainda conectando…');break;}cloudPush().then(n=>{if(!n)toast(navigator.onLine?'Tudo sincronizado':'Sem internet');});break;
    case'tab':ui.tab=v;ui.sheet=null;render();try{window.scrollTo(0,0);}catch(_){}break;
    case'step':ui.step=+v;render();try{window.scrollTo(0,0);}catch(_){}break;
    case'pick':ui.pick.has(v)?ui.pick.delete(v):ui.pick.add(v);render();break;
    case'pickDone':addSuggestions();save();ui.step=3;render();try{window.scrollTo(0,0);}catch(_){}break;
    case'suggestOpen':ui.pick=new Set();ui.sheet={type:'suggest'};render();break;
    case'pickAdd':{const n=ui.pick.size;addSuggestions();ui.sheet=null;save();render();if(n)toast(n+(n===1?' hábito adicionado':' hábitos adicionados'));break;}
    case'finish':C().setupDone=true;DT().start=DT().start||T;save();ui.tab='hoje';render();toast('Rotina pronta. Bom começo!');break;
    case'setupAgain':ui.tab='setup';ui.step=2;render();break;
    case'dayPrev':ui.sel=addDays(ui.sel,-1);render();break;
    case'dayNext':if(ui.sel<T){ui.sel=addDays(ui.sel,1);render();}break;
    case'dayToday':ui.sel=T;render();break;
    case'toggle':{ui.pop=id;const hb=habitById(id);const cur=dayRec(ui.sel).h[id];
      if(isDone(hb,cur)){act(()=>{delete dayW(ui.sel).h[id];});break;}
      if(hb.type==='check'&&hb.options&&hb.options.split(',').map(x=>x.trim()).filter(Boolean).length){ui.sheet={type:'option',hid:id};render();break;}
      act(()=>{dayW(ui.sel).h[id]=true;});break;}
    case'optPick':{const hid=ui.sheet.hid;ui.sheet=null;act(()=>{dayW(ui.sel).h[hid]=v;});break;}
    case'qty':act(()=>{const d=dayW(ui.sel);const n=Math.max(0,(+d.h[id]||0)+Number(v));if(n)d.h[id]=Math.round(n*100)/100;else delete d.h[id];});break;
    case'planRead':{const hb=habitById(id),p=planOf(hb);if(!p||planIdx(hb)>=p.items.length)break;act(()=>{const d=dayW(ui.sel);if(!Array.isArray(d.h[id]))d.h[id]=[];d.h[id].push(planIdx(hb));});break;}
    case'planUndo':act(()=>{const d=dayW(ui.sel);if(Array.isArray(d.h[id])){d.h[id].pop();if(!d.h[id].length)delete d.h[id];}});break;
    case'justify':ask('Justificar este dia?','Use para doença, viagem ou imprevistos. A sequência não quebra. Limite de '+C().justLimit+' por mês.','Justificar',()=>{dayW(ui.sel).j=true;});break;
    case'unjustify':act(()=>{dayW(ui.sel).j=false;});break;
    case'timerOpen':{const hb=habitById(id),tm=ui.timer;if(tm.hid!==id){if(tm.running){toast('Pause o outro cronômetro primeiro');break;}tm.hid=id;tm.total=(+hb.minutes||1)*60;tm.remain=tm.total;tm.open=true;}else tm.open=!tm.open;render();break;}
    case'timerStart':ui.timer.running=true;ui.timer.endAt=Date.now()+ui.timer.remain*1000;render();break;
    case'timerPause':ui.timer.remain=timerRemain();ui.timer.running=false;render();break;
    case'timerReset':ui.timer.running=false;ui.timer.remain=ui.timer.total;render();break;
    case'rMode':ui.rmode=v;ui.roff=0;render();break;
    case'rPrev':ui.roff--;render();break;
    case'rNext':if(ui.roff<0){ui.roff++;render();}break;
    case'mPrev':ui.moff--;render();break;
    case'mNext':if(ui.moff<futureOff()){ui.moff++;render();}break;
    /* edição de hábito */
    case'habitNew':ui.edit=normHabit({id:uid(),name:''});ui.sheet={type:'habit'};render();break;
    case'habitEdit':{const hb=habitById(id);if(!hb)break;ui.edit=clone(hb);ui.sheet={type:'habit'};render();break;}
    case'eType':ui.edit.type=v;if((v==='plan'||v==='qty')&&ui.edit.freq.kind==='weekly')ui.edit.freq.kind='daily';if(v==='plan'&&!ui.edit.planId&&C().plans[0])ui.edit.planId=C().plans[0].id;render();break;
    case'eFreq':ui.edit.freq.kind=v;render();break;
    case'eDay':{const i=+v,ds=ui.edit.freq.days;const j=ds.indexOf(i);j>=0?ds.splice(j,1):ds.push(i);render();break;}
    case'eColor':ui.edit.color=v;render();break;
    case'ePlan':ui.edit.planId=v;render();break;
    case'ePlanTpl':ui.edit.planId=bibleTpl().id;save();render();break;
    case'ePlanNew':ui.planEdit={id:uid(),name:'',text:'',back:'habit'};ui.sheet={type:'plan'};render();break;
    case'habitSave':{const e=ui.edit;if(!e.name.trim()){toast('Dê um nome ao hábito');break;}
      if(e.freq.kind==='days'&&!e.freq.days.length){toast('Escolha pelo menos um dia da semana');break;}
      if(e.type==='plan'&&!C().plans.some(p=>p.id===e.planId)){toast('Escolha ou crie um plano de leitura');break;}
      if(e.type==='qty'&&!(+e.goal>0)){toast('Defina uma meta maior que zero');break;}
      e.name=e.name.trim();e.goal=+e.goal||1;e.minutes=Math.max(1,Math.round(+e.minutes||15));e.pts=Math.max(0,Math.round(+e.pts||0));e.extraPts=Math.max(0,Math.round(+e.extraPts||0));
      e.freq.times=Math.min(7,Math.max(1,Math.round(+e.freq.times||1)));e.steps=e.steps.map(x=>+x>0?+x:1);
      const i=C().habits.findIndex(x=>x.id===e.id);const hb=normHabit(e);if(i>=0)C().habits[i]=hb;else C().habits.push(hb);
      ui.sheet=null;ui.edit=null;save();render();toast('Hábito salvo');break;}
    case'habitArchive':{const e=ui.edit;ask('Arquivar '+e.name+'?','Ele sai do dia a dia, mas o histórico e os pontos continuam. Você pode reativar em Ajustes.','Arquivar',()=>{const hb=habitById(e.id);if(hb)hb.archived=true;ui.edit=null;},true,true);break;}
    case'unarchive':{const hb=habitById(id);if(hb){hb.archived=false;save();render();}break;}
    case'hUp':{const L=C().habits,i=L.findIndex(x=>x.id===id);let j=i-1;while(j>=0&&L[j].archived)j--;if(j>=0){[L[i],L[j]]=[L[j],L[i]];save();render();}break;}
    /* planos */
    case'planNew':ui.planEdit={id:uid(),name:'',text:'',back:null};ui.sheet={type:'plan'};render();break;

    case'catDel':if(C().categories.length>1){C().categories=C().categories.filter(x=>x!==v);if(ui.draft.cat===v)ui.draft.cat=null;save();render();}break;
    case'theme':C().theme=v;save();applyTheme();render();break;
    case'resetAll':ask('Apagar tudo?','Rotina, histórico, pontos, prêmios e gastos serão apagados deste aparelho e da nuvem. Faça um backup antes, se quiser guardar.','Apagar tudo',()=>{S={config:normConfig(),data:normData()};ui.sel=todayKey();ui.tab='setup';ui.step=1;applyTheme();},true,true);break;
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.mask==='money'){const mk=maskMoney(t.value);if(mk!==t.value)t.value=mk;}
  if(t.dataset.d){ui.draft[t.dataset.d]=t.value;const pv=document.getElementById('inst-prev');if(pv)pv.textContent=instPrev();}
  if(t.dataset.w){ui.wish[t.dataset.w]=t.value;const c=document.getElementById('w-conv');if(c)c.textContent=convTxt();}
  if(t.dataset.r)ui.rec[t.dataset.r]=t.value;
  if(t.dataset.m)ui.mv[t.dataset.m]=t.value;
  if(t.dataset.tk)ui.tk[t.dataset.tk]=t.value;
  if(t.dataset.dt)ui.dt[t.dataset.dt]=t.value;
  if(t.dataset.av&&ui.av)ui.av[t.dataset.av]=t.value;
  if(t.dataset.sl&&ui.sl)ui.sl[t.dataset.sl]=t.value;
  if(t.dataset.ps&&ui.ps)ui.ps[t.dataset.ps]=t.value;
  if(t.dataset.bk)ui.bk[t.dataset.bk]=t.value;
  if(t.dataset.be&&ui.be)ui.be[t.dataset.be]=t.value;
  if(t.dataset.cl&&ui.cov)ui.cov.link=t.value;
  if(t.dataset.sh)ui.sh[t.dataset.sh]=t.value;
  if(t.dataset.cq&&ui.cov)ui.cov.q=t.value;
  if(t.dataset.tmdb){C().tmdbKey=t.value.trim();save();}
  if(t.dataset.p){ui.planEdit[t.dataset.p]=t.value;const c=document.getElementById('p-count');if(c)c.textContent=ui.planEdit.text.split('\n').filter(x=>x.trim()).length+' leituras';}
  if(t.dataset.e&&ui.edit){const f=t.dataset.e;if(f==='times')ui.edit.freq.times=t.value;else if(f==='s0')ui.edit.steps[0]=t.value;else if(f==='s1')ui.edit.steps[1]=t.value;else ui.edit[f]=t.value;}
  if(t.dataset.set&&t.dataset.str){C()[t.dataset.set]=t.value.trim().slice(0,30);save();}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.covfile){const f=t.files&&t.files[0];if(f&&ui.cov)covFile(f);t.value='';return;}
  if(t.dataset.sl&&ui.sl){ui.sl.date=t.value;render();return;}
  if(t.dataset.pg){const b=C().books.find(x=>x.id===t.dataset.pg);if(b){const pg=+b.pages||0;let n=Math.max(0,Math.round(+t.value||0));if(pg)n=Math.min(n,pg);b.page=n;save();render();}return;}
  if(t.dataset.set&&!t.dataset.str){const n=Number(t.value);if(!isFinite(n)||n<0)return;const p=t.dataset.set.split('.');
    if(p.length===1){if(p[0]==='rate'&&n<1)return;C()[p[0]]=Math.round(n);}else C()[p[0]][p[1]]=Math.round(n);save();toast('Salvo');}
  if(t.dataset.restore){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>tryRestore(String(r.result));r.readAsText(f);t.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render();return;}
  if(e.key==='Enter'){const t=e.target;if(t.id==='cv-q'&&ui.cov){e.preventDefault();ui.cov.q=t.value;covSearch();}else if(t.id==='cv-link'&&ui.cov){e.preventDefault();ui.cov.link=t.value;covLinkGo();}else if(t.tagName==='INPUT'&&t.type!=='date'&&t.type!=='number'&&t.dataset){const mp={m:'mvAdd',bk:'bkAdd',sh:'shAdd',d:'expSave',tk:'tkAdd',dt:'dtAdd',av:'avSave',be:'beSave'};const kk=Object.keys(mp).find(x=>t.dataset[x]!==undefined);if(kk){e.preventDefault();const b=document.querySelector('.sheet [data-a="'+mp[kk]+'"]');if(b)b.click();}}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(ui.sel>todayKey())ui.sel=todayKey();render();}});
let lastDay=todayKey();setInterval(()=>{const t=todayKey();if(t!==lastDay){if(ui.sel===lastDay)ui.sel=t;lastDay=t;render();}},30000);
applyTheme();cloudBoot();
})();

</script>
</body>
</html>
